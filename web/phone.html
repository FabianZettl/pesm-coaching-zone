<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#590d17">
<title>PESM Coaching Zone</title>
<style>
@font-face{font-family:"Barlow Condensed";font-style:italic;font-weight:800;font-display:swap;src:url(/fonts/barlow-condensed-latin-800-italic.woff2) format("woff2")}
@font-face{font-family:"Barlow Semi Condensed";font-weight:500;font-display:swap;src:url(/fonts/barlow-semi-condensed-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:"Barlow Semi Condensed";font-weight:600;font-display:swap;src:url(/fonts/barlow-semi-condensed-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:"Barlow Semi Condensed";font-weight:700;font-display:swap;src:url(/fonts/barlow-semi-condensed-latin-700-normal.woff2) format("woff2")}
/* Tokens follow the PES M Rust UI: "Sonntag" (light) and "Flutlicht" (dark). */
:root{
  --grund:#f6f3ee;--flaeche:#fff;--erhoehung:#fbf9f6;--ueberlagerung:#efe9df;--linie:#e4ded4;
  --text:#1b1f27;--text2:#5d6676;--gedaempft:#6b7280;--nav:#fffdf9;--schatten:rgba(0,0,0,.07);
  --akzent:#38bdf8;--gut:#3ecf8e;--achtung:#f5b942;--problem:#ff4d6a;
  --heim:#d4152f;--heim-tief:#590d17;--heim-weich:#f6e9eb;--gast:#3b82f6;--heim-text:#fff;--gast-text:#fff;--reiter-aktiv:var(--heim-weich);
  --rasen:#1E5A35;--rasen-streifen:#226440;
  --b-training:#3ecf8e;--b-finanzen:#f5b942;--b-presse:#38bdf8;--b-kabine:#a78bfa;--b-markt:#fb923c;--b-praesidium:#94a3b8;
  --t-tw:#a78bfa;--t-abw:#3b82f6;--t-mf:#14b8a6;--t-ang:#f43f5e;
  --titel:"Barlow Condensed","Arial Narrow",sans-serif;--body:"Barlow Semi Condensed","Arial Narrow",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--grund:#0f1218;--flaeche:#171c26;--erhoehung:#1e2430;--ueberlagerung:#2a3242;--linie:#2a3242;--text:#eef2f8;--text2:#9aa6b8;--gedaempft:#7f8a9c;--nav:#0b0e13;--schatten:rgba(0,0,0,.35);--reiter-aktiv:var(--heim-tief);color-scheme:dark}}
:root[data-theme="dark"]{--grund:#0f1218;--flaeche:#171c26;--erhoehung:#1e2430;--ueberlagerung:#2a3242;--linie:#2a3242;--text:#eef2f8;--text2:#9aa6b8;--gedaempft:#7f8a9c;--nav:#0b0e13;--schatten:rgba(0,0,0,.35);--reiter-aktiv:var(--heim-tief);color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--grund);color:var(--text);font-family:var(--body);font-weight:500;font-size:15px;line-height:1.3;display:flex;flex-direction:column;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--akzent);outline-offset:2px}
.titel{font-family:var(--titel);font-style:italic;font-weight:800;text-transform:uppercase}
.ueberzeile{font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.1em}

.kopf{flex:none;padding:calc(env(safe-area-inset-top,0px) + 8px) max(10px,env(safe-area-inset-right)) 0 max(10px,env(safe-area-inset-left));max-width:560px;width:100%;margin:0 auto}
.tafel{position:relative;border-radius:15px;overflow:hidden;background:var(--heim-tief);color:#fff;padding:8px 12px 12px}
.tafel::before{content:"";position:absolute;inset:0 0 0 45%;background:linear-gradient(90deg,transparent,rgba(212,21,47,.55))}
.tafel::after{content:"";position:absolute;left:0;right:0;bottom:0;height:4px;background:var(--heim)}
.tafel>*{position:relative}
.tafel.blitz{animation:blitz 1.2s}
@keyframes blitz{25%{filter:brightness(1.7)}}
.verb{display:flex;justify-content:space-between;gap:8px;color:rgba(255,255,255,.78)}
.verb span{display:inline-flex;align-items:center;gap:6px;min-width:0}
.verb i{width:7px;height:7px;border-radius:50%;background:var(--gut);flex:none}
.zeile{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:6px;margin-top:6px}
.tm{display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0;text-align:center}
.wappen{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-family:var(--titel);font-style:italic;font-weight:800;font-size:15px;position:relative}
.wappen::after{content:"";position:absolute;inset:4px;border-radius:50%;border:2px solid rgba(255,255,255,.6)}
.wappen.h{background:var(--heim);color:var(--heim-text)}.wappen.a{background:var(--gast-wappen,#fff);color:var(--gast-wappen-text,#1d3f8f)}.wappen.a::after{border-color:rgba(29,63,143,.55)}
.tm b{font-size:17px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tm small{font-size:11.5px;color:#e6eaf0;line-height:1.15}
.stand{font-size:54px;line-height:.9;font-variant-numeric:tabular-nums;text-align:center}
.minute{display:block;margin:4px auto 0;width:max-content;background:rgba(255,255,255,.14);border-radius:999px;padding:1px 10px;font-size:13px;font-weight:600}
.druck{display:flex;height:6px;gap:3px;margin-top:10px}.druck i{display:block;border-radius:999px;transition:width .5s}
.druck-l{display:flex;justify-content:space-between;font-size:11px;color:rgba(255,255,255,.7);margin-top:3px}
.streifen{margin-top:8px;background:var(--achtung);color:#1b1f27;font-size:14px;font-weight:600;padding:7px 12px;border-radius:10px}

main{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:10px max(10px,env(safe-area-inset-right)) 16px max(10px,env(safe-area-inset-left))}
.spalte{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.karte{background:var(--flaeche);border:1px solid var(--linie);border-radius:15px;box-shadow:0 4px 0 var(--schatten);overflow:hidden}
.k-kopf{height:34px;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 12px;color:#1b1f27}
.k-kopf h2{margin:0;font-size:19px;line-height:1}
.k-kopf small{font-size:12.5px;font-weight:600;opacity:.8}
.k-in{padding:12px;display:flex;flex-direction:column;gap:10px}
.kf-presse{background:var(--b-presse)}.kf-kabine{background:var(--b-kabine)}.kf-training{background:var(--b-training)}.kf-markt{background:var(--b-markt)}.kf-finanzen{background:var(--b-finanzen)}.kf-praes{background:var(--b-praesidium)}.kf-heim{background:var(--heim);color:var(--heim-text)}
.leer{color:var(--text2);font-size:14.5px}

nav{flex:none;border-top:1px solid var(--linie);background:var(--nav);padding:6px max(6px,env(safe-area-inset-right)) calc(env(safe-area-inset-bottom,0px) + 10px) max(6px,env(safe-area-inset-left))}
nav .r{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
nav button{border:2px solid transparent;background:transparent;border-radius:12px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:13px;font-weight:600;color:var(--text2);padding:4px 0;position:relative}
nav button svg{width:22px;height:22px}
nav button[aria-selected="true"]{color:var(--text);border-color:var(--heim);background:var(--reiter-aktiv)}
nav .dot{position:absolute;top:1px;right:calc(50% - 22px);min-width:16px;height:16px;border-radius:5px;background:var(--problem);color:#fff;font-size:10.5px;display:grid;place-items:center;padding:0 3px}

.ev{display:grid;grid-template-columns:44px 26px 1fr;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid var(--linie)}
.ev:last-child{border-bottom:0}
.ev .m{font-family:var(--titel);font-style:italic;font-weight:800;font-size:17px;color:var(--text2)}
.ev .ic{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;color:#1b1f27}
.ev .t{font-size:15px}
.ev .seite{display:block;font-size:12px;color:var(--gedaempft)}
.ic.goal{background:var(--gut)}.ic.own_goal{background:var(--b-praesidium)}.ic.yellow{background:var(--achtung)}.ic.second_yellow,.ic.red{background:var(--problem);color:#fff}.ic.sub{background:var(--b-presse)}.ic.penalty_missed{background:var(--b-markt)}.ic.chance{background:var(--b-kabine)}.ic.shot_wide,.ic.corner,.ic.free_kick,.ic.offside{background:var(--ueberlagerung);color:var(--text2)}
.ev.klein{padding:4px 0}.ev.klein .t{font-size:14px;color:var(--text2)}.ev.klein .ic{width:20px;height:20px;font-size:10px;margin-left:2px}
.vorschlag{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;width:100%;text-align:left;background:var(--erhoehung);border:1px solid var(--linie);border-radius:12px;padding:8px 10px}
.vorschlag small{display:block;color:var(--text2);font-size:12.5px}
.vorschlag .los{font-family:var(--titel);font-style:italic;font-weight:800;text-transform:uppercase;font-size:15px;color:var(--b-presse)}
.vorschlag.alle{grid-template-columns:1fr auto;background:transparent;border-style:dashed}
.knopfreihe{display:flex;gap:8px}.knopfreihe>*{flex:1}
.knopf.zweit{background:var(--flaeche);color:var(--text);border:1.5px solid var(--linie);box-shadow:none}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 86px);transform:translateX(-50%);background:var(--text);color:var(--grund);padding:9px 14px;border-radius:12px;font-weight:600;font-size:14.5px;max-width:calc(100% - 32px);z-index:5}

.seg{display:flex;gap:6px;flex-wrap:wrap}
.pille{border:1px solid var(--linie);background:var(--flaeche);border-radius:999px;padding:4px 12px;font-weight:600;font-size:14.5px}
.pille[aria-pressed="true"]{border:2px solid var(--heim);background:var(--reiter-aktiv);padding:3px 11px}
.feld{position:relative;width:100%;aspect-ratio:68/92;border-radius:10px;overflow:hidden;background:repeating-linear-gradient(180deg,var(--rasen) 0 10%,var(--rasen-streifen) 10% 20%)}
.feld svg.linien{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.sp{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:1px;border:0;background:transparent;padding:0}
.sp *{pointer-events:none}
.trikot{position:relative;width:34px;height:34px;display:inline-block;flex:none}
.trikot svg{width:34px;height:34px;display:block}
.trikot .foto{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 15%;border-radius:50%;background:var(--erhoehung);border:2px solid var(--linie);box-sizing:border-box;z-index:1}
.wappen img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;z-index:1;display:none}
.wappen.mitbild{background:none!important;color:transparent!important}.wappen.mitbild::after{display:none}.wappen.mitbild img{display:block}
.kw{width:30px;height:30px;object-fit:contain;display:block;margin-left:auto;background:rgba(255,255,255,.92);border-radius:50%;padding:3px;box-sizing:border-box}
.nr{position:absolute;inset:7px 0 0;text-align:center;font-family:var(--titel);font-style:italic;font-weight:800;font-size:13px;color:#fff}
.npw{position:absolute;left:30px;top:-4px}
.sp .trikot{width:40px;height:40px}.sp .trikot svg{width:40px;height:40px}.sp .nr{inset:9px 0 0;font-size:15px}.sp .npw{left:34px;top:-5px;z-index:2}
.ovr{position:absolute;left:-10px;bottom:-3px;z-index:2;background:#14181f;color:#fff;font-size:10.5px;font-weight:700;line-height:1;padding:2px 3px;border-radius:4px;font-variant-numeric:tabular-nums}
.zust{display:flex;align-items:center;gap:3px;margin-top:3px}
.fp{display:grid;place-items:center;width:14px;height:14px;border-radius:3px;font-size:11px;font-weight:800;line-height:1;color:#14181f}
.kb{width:34px;height:5px;border-radius:3px;background:rgba(0,0,0,.45);overflow:hidden}.kb i{display:block;height:100%}
.sp .name{font-size:11.5px;font-weight:600;color:#fff;background:rgba(0,0,0,.45);border-radius:4px;padding:0 5px;white-space:nowrap;max-width:86px;overflow:hidden;text-overflow:ellipsis}
.sp .mk{position:absolute;left:-6px;top:-4px;display:flex;gap:2px}
.mk i{display:block;width:8px;height:11px;border-radius:2px}
.mk .g{background:var(--achtung)}.mk .r{background:var(--problem)}
.sp.gew .trikot{outline:2px solid var(--akzent);outline-offset:3px;border-radius:10px}
.np{display:inline-grid;place-items:center;width:42px;height:22px;border-radius:5px;font-weight:700;font-size:13.5px;color:#1b1f27;font-variant-numeric:tabular-nums}
.np.s{width:30px;height:17px;font-size:11.5px}
.n-top{background:#2e9e6a;color:#fff}.n-gut{background:var(--gut)}.n-achtung{background:var(--achtung)}.n-problem{background:var(--problem);color:#fff}.n-leer{background:var(--ueberlagerung);color:var(--text2)}
.pos{display:inline-grid;place-items:center;min-width:34px;height:20px;border-radius:5px;font-size:12px;font-weight:700;padding:0 4px}
.liste .zl{display:grid;grid-template-columns:auto 1fr auto auto;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--linie);width:100%;border-left:0;border-right:0;border-top:0;background:none;text-align:left}
.liste .zl:last-child{border-bottom:0}
.liste .zl small{display:block;color:var(--gedaempft);font-size:12.5px}
.detail{display:flex;flex-direction:column;gap:8px}
.detail .oben{display:flex;align-items:center;gap:10px}
.detail h3{margin:0;font-size:22px;line-height:1}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.kv div{background:var(--erhoehung);border:1px solid var(--linie);border-radius:10px;padding:6px 8px}
.kv b{display:block;font-family:var(--titel);font-style:italic;font-weight:800;font-size:22px;line-height:1}
.kv span{font-size:12px;color:var(--text2)}

.st{display:grid;grid-template-columns:44px 1fr 44px;gap:8px;align-items:center;font-variant-numeric:tabular-nums}
.st b{font-size:16px}.st b:last-child{text-align:right}
.st .mitte{display:flex;flex-direction:column;gap:3px}
.st .mitte span{text-align:center;font-size:13px;color:var(--text2);font-weight:600}
.balken{display:flex;gap:3px;height:6px}.balken i{display:block;border-radius:999px}
.flow{display:grid;grid-template-columns:52px 1fr;gap:6px 8px;align-items:center;font-size:13px}
.flow .bars{display:flex;flex-direction:column;gap:2px}
.flow .bars i{display:block;height:7px;border-radius:999px;min-width:2px}
.tab{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
.tab th{font-size:12px;color:var(--text2);text-align:right;font-weight:600;padding:4px 3px;border-bottom:1px solid var(--linie)}
.tab th:first-child,.tab td:first-child{text-align:left}
.tab td{padding:6px 3px;border-bottom:1px solid var(--linie);text-align:right}
.tab tr:last-child td{border-bottom:0}

.warten{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:26px 16px}
.warten .ball{width:56px;height:56px;border-radius:50%;background:var(--erhoehung);border:1px solid var(--linie);display:grid;place-items:center}
.warten .ball svg{width:30px;height:30px;color:var(--text2)}
.warten h2{margin:0;font-size:26px}
.warten p{margin:0;color:var(--text2);max-width:34ch}
.koppeln{max-width:420px;margin:auto;padding:24px 16px;display:flex;flex-direction:column;gap:14px;text-align:center}
.koppeln h1{margin:0;font-size:40px;line-height:.95}
.koppeln input{font-family:var(--titel);font-style:italic;font-weight:800;font-size:40px;letter-spacing:.3em;text-align:center;width:100%;border-radius:12px;border:2px solid var(--linie);background:var(--flaeche);color:var(--text);padding:8px 0 8px .3em}
.knopf{border:0;border-radius:10px;min-height:46px;padding:6px 14px;background:var(--akzent);color:#0b1220;font-family:var(--titel);font-style:italic;font-weight:800;text-transform:uppercase;font-size:21px;box-shadow:0 3px 0 rgba(56,189,248,.3)}
.fehler{color:var(--problem);font-weight:600;min-height:1.3em}
.thema{background:none;border:0;color:rgba(255,255,255,.78);padding:0 2px;display:inline-flex}
.thema svg{width:15px;height:15px}
@media (prefers-reduced-motion:reduce){.tafel.blitz{animation:none}.druck i{transition:none}}

/* Ticker, newspaper style: big cards for goals, cards and subs, text lines for the rest. */
.tk{display:flex;flex-direction:column;gap:12px}
.tk-z{display:grid;grid-template-columns:44px 1fr;gap:6px;padding:2px 2px}
.tk-z .m{font-family:var(--titel);font-style:italic;font-weight:800;font-size:22px;line-height:1.1}
.tk-z .t{font-size:15.5px;font-weight:600;line-height:1.35}
.tk-z.leise .t{font-weight:500;color:var(--text2);font-size:14.5px}.tk-z.leise .m{color:var(--text2);font-size:18px}
.tk-z.heiss .m{color:var(--problem)}
.gk{border-radius:14px;overflow:hidden;background:var(--flaeche);box-shadow:0 2px 10px var(--schatten)}
.gk-kopf{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;padding:10px 14px;color:#fff}.gk-kopf.s0{color:var(--heim-text)}.gk-kopf.s1{color:var(--gast-text)}
.gk-kopf .m{font-family:var(--titel);font-style:italic;font-weight:800;font-size:24px}
.gk-kopf h3{margin:0;text-align:center;font-family:var(--titel);font-style:italic;font-weight:800;font-size:18px;letter-spacing:.3px;text-transform:uppercase}
.gk-kopf .sym{font-size:20px;width:26px;text-align:right}
.gk-in{padding:12px 14px 14px}
.gk-sp{display:grid;grid-template-columns:54px 1fr auto;align-items:center;gap:12px;background:var(--erhoehung);border:1px solid var(--linie);border-radius:10px;padding:8px 10px}
.gk-sp .trikot{position:relative;width:50px;height:50px;display:block}.gk-sp .trikot svg,.wz .trikot svg{width:100%;height:100%;display:block}.gk-sp .nr{font-size:18px;inset:12px 0 0}
.gk-sp .vor{font-size:13px;color:var(--text2);display:block}
.gk-sp .nam{font-family:var(--titel);font-style:italic;font-weight:800;font-size:22px;line-height:1.05;text-transform:uppercase}
.gk-sp .art{font-size:13px;color:var(--text2);display:block;margin-top:3px}
.stand{font-family:var(--titel);font-weight:800;font-size:24px;border:2px solid currentColor;border-radius:8px;padding:2px 10px;white-space:nowrap}
.stand i{font-style:normal;opacity:.45}
.gk-txt{margin:10px 2px 0;font-size:15px;font-weight:600;line-height:1.4}
.gk.tor .gk-in{background:linear-gradient(180deg,var(--erhoehung),var(--flaeche))}
.wb{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.wb:last-of-type{margin-bottom:0}
.wz{display:grid;grid-template-columns:38px 1fr;align-items:center;gap:8px;border:1px solid var(--linie);border-radius:10px;padding:6px 8px;background:var(--erhoehung);position:relative}
.wz.raus{grid-template-columns:1fr 38px;text-align:right}.wz.raus .trikot{order:2}
.wz .trikot{position:relative;width:36px;height:36px;display:block}
.wz b{font-family:var(--titel);font-style:italic;font-weight:800;font-size:17px;text-transform:uppercase;line-height:1.05;display:block}
.wz small{font-size:12px;color:var(--text2)}
.wz .pf{position:absolute;top:-9px;font-weight:800;font-size:14px}
.wz.rein .pf{right:8px;color:var(--gut)}.wz.raus .pf{left:8px;color:var(--problem)}
.kk{width:16px;height:22px;border-radius:3px;display:inline-block;box-shadow:0 1px 2px rgba(0,0,0,.4)}
.kk.g{background:#f5c518}.kk.r{background:#e3262f}.kk.gr{background:linear-gradient(135deg,#f5c518 50%,#e3262f 50%)}
</style>
</head>
<body>
<section id="koppeln" class="koppeln" hidden>
  <div class="ueberzeile" style="color:var(--text2)">PESM Coaching Zone</div>
  <h1 class="titel">Connect to your PC</h1>
  <p style="margin:0;color:var(--text2)">Enter the 4-digit code shown on your PC. Or scan the QR code there, then you don't need the code.</p>
  <input id="code" inputmode="numeric" autocomplete="one-time-code" maxlength="4" aria-label="4-digit code" placeholder="····">
  <button class="knopf" id="code-ok">Connect</button>
  <div class="fehler" id="code-fehler" role="alert"></div>
</section>

<div id="app" hidden style="display:contents">
  <header class="kopf">
    <div class="tafel" id="tafel">
      <div class="verb ueberzeile"><span id="verb"><i></i>Connected</span><span><span id="abschnitt"></span><button class="thema" id="thema" aria-label="Switch light/dark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button></span></div>
      <div class="zeile">
        <div class="tm"><div class="wappen h" id="w-h"><span id="w-h-t">H</span></div><b class="titel" id="n-h">Home</b><small id="tore-h"></small></div>
        <div><div class="stand titel" id="stand">0:0</div><span class="minute" id="minute">–</span></div>
        <div class="tm"><div class="wappen a" id="w-a"><span id="w-a-t">A</span></div><b class="titel" id="n-a">Away</b><small id="tore-a"></small></div>
      </div>
      <div class="druck" aria-hidden="true"><i id="dr-h" style="background:#fff;width:50%"></i><i id="dr-a" style="background:var(--gast);width:50%"></i></div>
      <div class="druck-l"><span>Ball touches, this period</span><span id="dr-z"></span></div>
    </div>
    <div class="streifen" id="abriss" hidden role="status">Connection to your PC lost. Reconnecting…</div>
  </header>
  <main><div class="spalte" id="inhalt"></div></main>
  <nav><div class="r" role="tablist">
    <button role="tab" data-t="match" aria-selected="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3"/></svg>Match</button>
    <button role="tab" data-t="xi" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M8 3 4 6l2 4 2-1v12h8V9l2 1 2-4-4-3c-1 1.5-2.5 2-4 2s-3-.5-4-2z"/></svg>XI</button>
    <button role="tab" data-t="stats" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 20V11M12 20V4M19 20v-6"/></svg>Stats</button>
    <button role="tab" data-t="ticker" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg>Ticker<span class="dot" id="dot" hidden></span></button>
  </div></nav>
</div>

<script>
"use strict";
var $=function(id){return document.getElementById(id)};
var esc=function(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})};
var store={get:function(k){try{return localStorage.getItem(k)}catch(e){return null}},set:function(k,v){try{localStorage.setItem(k,v)}catch(e){}},del:function(k){try{localStorage.removeItem(k)}catch(e){}}};
var S={filter:store.get("cz-filter")||"key",wechsel:null,mein:store.get("cz-mein"),tab:store.get("cz-tab")||"match",seite:0,gew:null,data:null,seq:null,ungelesen:0,ws:null,offen:false};

// Theme
(function(){var t=store.get("cz-theme");if(t)document.documentElement.dataset.theme=t})();
$("thema").onclick=function(){var dark=document.documentElement.dataset.theme?document.documentElement.dataset.theme==="dark":matchMedia("(prefers-color-scheme: dark)").matches;var t=dark?"light":"dark";document.documentElement.dataset.theme=t;store.set("cz-theme",t)};

// Pairing: token from QR link (?k=...) or from the 4-digit code.
var token=new URLSearchParams(location.search).get("k");
if(token){store.set("cz-token",token);history.replaceState(null,"","/")}else token=store.get("cz-token");
function zeigeKoppeln(msg){$("app").hidden=true;$("koppeln").hidden=false;$("code-fehler").textContent=msg||"";setTimeout(function(){$("code").focus()},50)}
$("code-ok").onclick=function(){var c=$("code").value.trim();if(!/^\d{4}$/.test(c)){$("code-fehler").textContent="Please enter the 4 digits.";return}
  fetch("/pair",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({code:c})}).then(function(r){return r.ok?r.json():r.text().then(function(t){throw new Error(t)})})
  .then(function(j){token=j.token;store.set("cz-token",token);start()}).catch(function(e){$("code-fehler").textContent=e.message||"Could not connect."})};
$("code").addEventListener("keydown",function(e){if(e.key==="Enter")$("code-ok").click()});

function start(){$("koppeln").hidden=true;$("app").hidden=false;verbinde();render()}
var retry=0;
function verbinde(){
  var ws=new WebSocket((location.protocol==="https:"?"wss://":"ws://")+location.host+"/ws?k="+encodeURIComponent(token));S.ws=ws;
  ws.onopen=function(){S.offen=true;retry=0;$("abriss").hidden=true};
  ws.onmessage=function(e){try{neu(JSON.parse(e.data))}catch(err){}};
  ws.onclose=function(ev){S.offen=false;
    if(!S.data&&retry===0){fetch("/check?k="+encodeURIComponent(token)).then(function(r){if(r.status===401){store.del("cz-token");zeigeKoppeln("This phone is not paired yet. Enter the code from your PC.")}else nochmal()}).catch(nochmal);return}
    nochmal()};
}
function nochmal(){$("abriss").hidden=false;retry++;setTimeout(verbinde,Math.min(8000,1000*retry))}

function vib(ms){try{if(navigator.vibrate)navigator.vibrate(ms)}catch(e){}}
function neu(d){
  var m=d.match,alt=S.data&&S.data.match;
  if(m&&alt&&S.seq!==null&&m.last_seq>S.seq){
    var neue=m.events.filter(function(e){return e.seq>S.seq});
    var stark=neue.some(function(e){return e.kind==="goal"||e.kind==="own_goal"||e.kind==="red"||e.kind==="second_yellow"});
    if(neue.some(function(e){return VIB[e.kind]}))vib(stark?[120,80,120]:120);
    if(neue.some(function(e){return e.kind==="goal"||e.kind==="own_goal"})){var t=$("tafel");t.classList.remove("blitz");void t.offsetWidth;t.classList.add("blitz")}
    if(S.tab!=="ticker")S.ungelesen+=neue.filter(function(e){return e.key}).length;
  }
  if(m)S.seq=m.last_seq;else S.seq=null;
  S.data=d;if(S.druck)S.warte=true;else render();
}
// Don't rebuild the page while a finger is down, or the tap gets lost.
document.addEventListener("pointerdown",function(){S.druck=true},true);
["pointerup","pointercancel"].forEach(function(t){document.addEventListener(t,function(){setTimeout(function(){S.druck=false;if(S.warte){S.warte=false;render()}},40)},true)});

var POSF={GK:"--t-tw",CB:"--t-abw",LB:"--t-abw",RB:"--t-abw",DMF:"--t-mf",CMF:"--t-mf",LMF:"--t-mf",RMF:"--t-mf",AMF:"--t-mf",LWF:"--t-ang",RWF:"--t-ang",SS:"--t-ang",CF:"--t-ang"};
function posmarke(p){if(!p)return "";var v=POSF[p]||"--t-mf";return '<span class="pos" style="color:var('+v+');background:color-mix(in srgb,var('+v+') 15%,transparent)">'+p+"</span>"}
function noteKl(r){return r==null?"n-leer":r>=8?"n-top":r>=7?"n-gut":r>=6?"n-achtung":"n-problem"}
function note(r,klein){return '<span class="np '+(klein?"s ":"")+noteKl(r)+'">'+(r==null?"–":r.toFixed(1))+"</span>"}
function kurz(n){n=(n||"").trim();return (n.replace(/[^A-Za-z]/g,"").slice(0,3)||"?").toUpperCase()}
// Team colours from the mod's kits; text turns dark on light colours.
function rgb(h){return [1,3,5].map(function(i){return parseInt(h.substr(i,2),16)})}
function hexr(c){return "#"+c.map(function(v){v=Math.max(0,Math.min(255,Math.round(v)));return (v<16?"0":"")+v.toString(16)}).join("")}
function hell(c){return (0.299*c[0]+0.587*c[1]+0.114*c[2])>165}
function teamFarben(m){
  var k=(m.colors||[null,null]).join("|");if(k===S.farbKey)return;S.farbKey=k;
  var r=document.documentElement.style;
  [["heim",0],["gast",1]].forEach(function(x){var h=m.colors&&m.colors[x[1]];
    if(!h){["","-text","-tief","-weich","-wappen","-wappen-text"].forEach(function(suf){r.removeProperty("--"+x[0]+suf)});return}
    var c=rgb(h);r.setProperty("--"+x[0],h);r.setProperty("--"+x[0]+"-text",hell(c)?"#14181f":"#fff");
    if(x[1]===1){r.setProperty("--gast-wappen",h);r.setProperty("--gast-wappen-text",hell(c)?"#14181f":"#fff")}
    if(x[1]===0){r.setProperty("--heim-tief",hexr(c.map(function(v){return v*0.35})));r.setProperty("--heim-weich",hexr(c.map(function(v){return 255-(255-v)*0.12})))}
  });
}
function farbe(side){return side===0?"var(--heim)":"var(--gast)"}
// Crests and player photos from the game's files; a missing one falls back quietly.
var FEHLT={};
function bildUrl(k,id){return "/img/"+k+"/"+id+"?k="+encodeURIComponent(token)}
function fehlt(img,ersatz){FEHLT[img.getAttribute("src")]=1;if(ersatz!=null)img.replaceWith(document.createTextNode(ersatz));else img.remove()}
function foto(p){if(!p||!p.id)return "";var u=bildUrl("player",p.id);return FEHLT[u]?"":'<img class="foto" alt="" src="'+u+'" onerror="fehlt(this)">'}
function wappenKlein(m,side,ersatz){var id=m.team_ids&&m.team_ids[side];var u=id&&bildUrl("team",id);if(!u||FEHLT[u])return ersatz;return '<img class="kw" alt="" src="'+u+'" onerror="fehlt(this,\''+ersatz+'\')">'}
function wappenTafel(el,m,side){
  var id=m.team_ids&&m.team_ids[side],u=id?bildUrl("team",id):"";
  if(el.dataset.bild===u)return;el.dataset.bild=u;el.classList.remove("mitbild");
  var alt=el.querySelector("img");if(alt)alt.remove();
  if(!u||FEHLT[u])return;
  var img=new Image();img.alt="";img.onload=function(){if(el.dataset.bild===u)el.classList.add("mitbild")};img.onerror=function(){FEHLT[u]=1;img.remove()};img.src=u;el.appendChild(img);
}
// Form arrow (0 worst .. 4 best) and fitness bar; both only when the game data is there.
var FORM=[["↓","#e5484d"],["↘","#f5a524"],["→","#f5d90a"],["↗","#9be15d"],["↑","#30c46c"]];
function formPfeil(f){if(f==null||!FORM[f])return "";return '<span class="fp" style="background:'+FORM[f][1]+'" title="Form">'+FORM[f][0]+"</span>"}
function kondBalken(k){if(k==null)return "";var c=k>=60?"#30c46c":k>=30?"#f5d90a":"#e5484d";return '<span class="kb" title="Fitness '+k+'%"><i style="width:'+k+"%;background:"+c+'"></i></span>'}
function zustand(p){return p.form==null&&p.fitness==null?"":'<span class="zust">'+formPfeil(p.form)+kondBalken(p.fitness)+"</span>"}
function ovrMarke(p){return p.ovr==null?"":'<span class="ovr" title="Overall">'+p.ovr+"</span>"}
function trikot(side,nr,gk){var c=gk?"var(--b-kabine)":farbe(side);return '<svg viewBox="0 0 34 34" aria-hidden="true"><path d="M11 3 4 7l3 7 3-1.5V31h14V12.5l3 1.5 3-7-7-4c-1.2 2-3 3-5 3s-3.8-1-5-3z" fill="'+c+'" stroke="rgba(0,0,0,.35)" stroke-width="1"/><path d="M13 3.6 17 8l4-4.4" fill="none" stroke="rgba(255,255,255,.7)" stroke-width="1.3"/></svg><span class="nr"'+(gk?"":' style="color:var(--'+(side?"gast":"heim")+'-text)"')+'>'+(nr==null?"":nr)+"</span>"}

var ICON={goal:"G",own_goal:"OG",yellow:"",second_yellow:"",red:"",sub:"⇄",penalty_missed:"P",chance:"!",shot_wide:"↗",corner:"C",free_kick:"FK",offside:"OS"};
var VIB={goal:1,own_goal:1,yellow:1,second_yellow:1,red:1,penalty_missed:1};
function evZeile(e,m){var team=e.side===0?m.home:m.away;
  return '<div class="ev'+(e.key?"":" klein")+'"><span class="m">'+e.minute+"'</span><span class=\"ic "+e.kind+'">'+ICON[e.kind]+'</span><span class="t">'+esc(e.text)+'<span class="seite">'+esc(team)+"</span></span></div>"}

function warten(d){
  var t={waiting_game:["Waiting for FL27","Start Football Life 2027 on your PC. This page updates on its own."],
         waiting_match:["Waiting for kick-off","FL27 is running. Start a match and the stats appear here."],
         error:["Can't read the game",d.message||""]}[d.status]||["Connecting…",""];
  return '<section class="karte"><div class="warten"><div class="ball"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="m12 7 4 3-1.5 4.5h-5L8 10z"/></svg></div><h2 class="titel">'+esc(t[0])+"</h2><p>"+esc(d.status==="waiting_match"&&d.message?d.message:t[1])+"</p></div></section>"}

function render(){
  var d=S.data;
  document.querySelectorAll("nav button").forEach(function(b){b.setAttribute("aria-selected",String(b.dataset.t===S.tab))});
  if(S.tab==="ticker")S.ungelesen=0;
  $("dot").hidden=!S.ungelesen;$("dot").textContent=S.ungelesen>9?"9+":S.ungelesen;
  var m=d&&d.match;
  $("verb").innerHTML='<i style="background:'+(S.offen?"var(--gut)":"var(--achtung)")+'"></i>'+(d&&d.demo?"Demo match":S.offen?"Connected to your PC":"Connecting");
  if(m){
    teamFarben(m);
    $("n-h").textContent=m.home;$("n-a").textContent=m.away;$("w-h-t").textContent=kurz(m.home);$("w-a-t").textContent=kurz(m.away);wappenTafel($("w-h"),m,0);wappenTafel($("w-a"),m,1);
    $("stand").textContent=m.score[0]+":"+m.score[1];
    $("minute").textContent=(m.minute_tracked?"":"~")+m.minute+"'  ·  "+m.period_label;
    $("abschnitt").textContent="";
    var tore=function(side){return m.events.filter(function(e){return (e.kind==="goal"&&e.side===side)||(e.kind==="own_goal"&&e.side!==side)}).map(function(e){var p=spieler(m,e.side,e.slot);return esc(p?p.name:"?")+" "+e.minute+"'"+(e.kind==="own_goal"?" (OG)":"")}).join(", ")};
    $("tore-h").innerHTML=tore(0);$("tore-a").innerHTML=tore(1);
    $("dr-h").style.width=m.touch_share+"%";$("dr-a").style.width=(100-m.touch_share)+"%";$("dr-z").textContent=m.touch_share+" : "+(100-m.touch_share);
  }
  var h="";
  if(!d){h='<section class="karte"><div class="warten"><h2 class="titel">Connecting…</h2></div></section>'}
  else if(!m||d.status!=="live"&&!m){h=warten(d)}
  else{
    if(d.status!=="live")h+='<div class="streifen" style="margin:0">'+esc(d.message||"Match paused.")+"</div>";
    h+=({match:tabMatch,xi:tabXI,stats:tabStats,ticker:tabTicker})[S.tab](m,d);
  }
  if(S.letzt!==h){$("inhalt").innerHTML=h;S.letzt=h;binde()}
}
function spieler(m,side,slot){for(var i=0;i<m.players.length;i++){var p=m.players[i];if(p.side===side&&p.slot===slot)return p}return null}

function wartend(m,side){
  var w=(m.subs_pending||[]).filter(function(x){return side==null||x.side===side});
  if(!w.length)return "";
  return '<section class="karte" style="border:2px solid var(--b-presse)"><div class="k-kopf kf-presse"><h2 class="titel">Sub waiting</h2><small>comes at the next stoppage</small></div><div class="k-in">'+w.map(function(x){var i=spieler(m,x.side,x.in_slot),o=spieler(m,x.side,x.out_slot);return '<div class="hinweis-z">'+esc(i?i.name:"?")+" on for "+esc(o?o.name:"?")+'</div>'}).join("")+'<div class="leer" style="font-size:13px">Requested. FL27 makes the change when the ball goes out or the referee stops play.</div></div></section>';
}
function tabMatch(m,d){
  var letzte=m.events.filter(function(e){return e.key}).slice(-4).reverse();
  var top=m.players.filter(function(p){return p.rating!=null}).sort(function(a,b){return b.rating-a.rating})[0];
  var h=wartend(m,null)+'<section class="karte"><div class="k-kopf kf-presse"><h2 class="titel">Latest</h2><small>read from game memory</small></div><div class="k-in">'+(letzte.length?letzte.map(function(e){return evZeile(e,m)}).join(""):'<div class="leer">No goals, cards or subs yet.</div>')+"</div></section>";
  if(top)h+='<section class="karte"><div class="k-kopf kf-finanzen"><h2 class="titel">Best on the pitch</h2><small>rating so far</small></div><div class="k-in"><div class="detail"><div class="oben"><span class="trikot" style="position:relative;width:34px;height:34px;display:inline-block">'+trikot(top.side,top.number,top.position==="GK")+foto(top)+'</span><div style="flex:1;min-width:0"><h3 class="titel">'+esc(top.name)+'</h3><div style="color:var(--text2);font-size:13.5px">'+posmarke(top.position)+" "+esc(top.side===0?m.home:m.away)+"</div></div>"+note(top.rating)+"</div></div></div></section>";
  var r=function(l){for(var i=0;i<m.team_stats.length;i++)if(m.team_stats[i].label===l)return m.team_stats[i];return {home:0,away:0}};
  h+='<section class="karte"><div class="k-kopf kf-training"><h2 class="titel">At a glance</h2><small>'+esc(m.home)+" · "+esc(m.away)+'</small></div><div class="k-in">'+stz("Shots",r("Shots").home,r("Shots").away)+stz("On target",r("On target").home,r("On target").away)+stz("xG (simple)",m.xg[0],m.xg[1],true)+stz("Pass accuracy %",r("Pass accuracy %").home,r("Pass accuracy %").away)+"</div></section>";
  if(d.demo)h+='<div class="leer" style="text-align:center">Demo: made-up players and a random match.</div>';
  return h;
}
function stz(l,a,b,dez){var s=(+a)+(+b),pa=s?a/s*100:50;
  return '<div class="st"><b>'+(dez?(+a).toFixed(2):a)+'</b><div class="mitte"><span>'+esc(l)+'</span><div class="balken"><i style="width:'+pa+'%;background:var(--heim)"></i><i style="width:'+(100-pa)+'%;background:var(--gast)"></i></div></div><b>'+(dez?(+b).toFixed(2):b)+"</b></div>"}

// Rows on the pitch (0 = goal line). x: -1 left, 0 centre, 1 right.
var SIDEX={LB:-1,LMF:-1,LWF:-1,RB:1,RMF:1,RWF:1};
function aufstellung(liste){
  var hatPos=liste.every(function(p){return (p.role||p.position)});
  var g=function(f){return liste.filter(f)};
  var reihen;
  if(hatPos){
    var gk=g(function(p){return (p.role||p.position)==="GK"}),ab=g(function(p){return ["CB","LB","RB"].indexOf((p.role||p.position))>=0});
    var dm=g(function(p){return (p.role||p.position)==="DMF"}),cm=g(function(p){return ["CMF","LMF","RMF"].indexOf((p.role||p.position))>=0});
    var am=g(function(p){return (p.role||p.position)==="AMF"}),st=g(function(p){return ["LWF","RWF","SS","CF"].indexOf((p.role||p.position))>=0});
    reihen=[gk,ab];
    if(dm.length+cm.length<=4)reihen.push(dm.concat(cm));else{reihen.push(dm);reihen.push(cm)}
    if(am.length+st.length<=3)reihen.push(am.concat(st));else{reihen.push(am);reihen.push(st)}
  }else{
    reihen=[g(function(p){return p.slot===0}),g(function(p){return p.slot>=1&&p.slot<=4}),g(function(p){return p.slot>=5&&p.slot<=8}),g(function(p){return p.slot>8})];
  }
  reihen=reihen.filter(function(r){return r.length});
  var out=[],n=reihen.length;
  reihen.forEach(function(row,ri){row=row.slice().sort(function(a,b){return (SIDEX[(a.role||a.position)]||0)-(SIDEX[(b.role||b.position)]||0)||a.slot-b.slot});
    var y=n>1?90-ri*(76/(n-1)):50;row.forEach(function(p,i){out.push({p:p,x:(i+1)/(row.length+1)*100,y:y})})});
  return out;
}
function tabXI(m){
  var side=S.seite,team=side===0?m.home:m.away;
  var auf=m.players.filter(function(p){return p.side===side&&p.on_pitch}).sort(function(a,b){return a.slot-b.slot});
  var bank=m.players.filter(function(p){return p.side===side&&!p.on_pitch});
  var gew=S.gew!=null?spieler(m,side,S.gew):null;
  var h='<div class="seg"><button class="pille" data-seite="0" aria-pressed="'+(side===0)+'">'+esc(m.home)+'</button><button class="pille" data-seite="1" aria-pressed="'+(side===1)+'">'+esc(m.away)+"</button></div>";
  if(m.subs&&m.subs.available&&S.mein==null)h+='<section class="karte"><div class="k-kopf kf-presse"><h2 class="titel">Which team is yours?</h2><small>for substitutions</small></div><div class="k-in"><div class="knopfreihe"><button class="knopf zweit" data-mein="0">'+esc(m.home)+'</button><button class="knopf zweit" data-mein="1">'+esc(m.away)+"</button></div></div></section>";
  h+=wartend(m,side);
  if(S.wechsel&&side===meineSeite(m))h+=wechselKarte(m);else if(gew)h+=detail(gew,m);
  h+='<section class="karte"><div class="k-kopf kf-heim" style="background:'+farbe(side)+';color:'+(side?"var(--gast-text)":"var(--heim-text)")+'"><h2 class="titel">'+esc(team)+'</h2><small>tap a shirt for details</small></div><div class="k-in"><div class="feld"><svg class="linien" viewBox="0 0 68 92" preserveAspectRatio="none" fill="none" stroke="rgba(255,255,255,.45)" stroke-width=".5"><rect x="2" y="2" width="64" height="88"/><line x1="2" y1="46" x2="66" y2="46"/><circle cx="34" cy="46" r="8"/><rect x="16" y="2" width="36" height="14"/><rect x="16" y="76" width="36" height="14"/><rect x="26" y="2" width="16" height="5"/><rect x="26" y="85" width="16" height="5"/></svg>';
  aufstellung(auf).forEach(function(o){var p=o.p;
    h+='<button class="sp'+(S.gew===p.slot?" gew":"")+'" data-slot="'+p.slot+'" style="left:'+o.x+"%;top:"+o.y+'%" aria-label="'+esc(p.name)+", rating "+(p.rating==null?"none":p.rating.toFixed(1))+'"><span class="trikot">'+trikot(side,p.number,p.position==="GK")+foto(p)+ovrMarke(p)+'<span class="npw">'+note(p.rating,true)+'</span><span class="mk">'+(p.yellow?'<i class="g"></i>':"")+"</span></span>"+zustand(p)+"<span class=\"name\">"+esc(p.name)+"</span></button>"});
  h+="</div></div></section>";
  h+='<section class="karte"><div class="k-kopf kf-praes"><h2 class="titel">Bench &amp; off</h2><small>'+m.events.filter(function(e){return e.kind==="sub"&&e.side===side}).length+' subs made</small></div><div class="k-in liste">'+
    (bank.length?bank.map(function(p){var st=p.went_off?"subbed off":p.sent_off?"sent off":"on the bench";
      return '<button class="zl" data-slot="'+p.slot+'"><span class="trikot" style="position:relative;width:34px;height:34px;display:inline-block">'+trikot(side,p.number,p.position==="GK")+foto(p)+ovrMarke(p)+'</span><span>'+esc(p.name)+"<small>"+st+"</small>"+zustand(p)+"</span>"+posmarke(p.position)+note(p.rating,true)+"</button>"}).join(""):'<div class="leer">No bench players found.</div>')+"</div></section>";
  if(!S.data.names)h+='<div class="leer" style="text-align:center">No player names: start PESM Coaching Zone with <b>--game</b> and your FL27 folder.</div>';
  return h;
}
function detail(p,m){
  var acc=p.passes?Math.round(p.passes_ok/p.passes*100)+"%":"–";
  var kv0=[];if(p.ovr!=null)kv0.push(["Overall",p.ovr]);if(p.fitness!=null)kv0.push(["Fitness",p.fitness+"%"]);if(p.form!=null)kv0.push(["Form",FORM[p.form]?FORM[p.form][0]:"–"]);
  var kv=p.position==="GK"?[["Saves",p.saves],["Passes",p.passes],["Pass acc.",acc]]:[["Goals",p.goals],["Assists",p.assists],["Shots",p.shots+" ("+p.on_target+")"],["Passes",p.passes],["Pass acc.",acc],["Duels won",p.duels_won],["Intercept.",p.interceptions],["Touches",p.touches],["Fouls",p.fouls]];kv=kv0.concat(kv);
  return '<section class="karte" style="border:2px solid var(--akzent)"><div class="k-in detail"><div class="oben"><span class="trikot" style="position:relative;width:34px;height:34px;display:inline-block">'+trikot(p.side,p.number,p.position==="GK")+foto(p)+'</span><div style="flex:1;min-width:0"><h3 class="titel">'+esc(p.name)+"</h3><div style=\"font-size:13.5px;color:var(--text2)\">"+posmarke(p.position)+" "+esc(p.full_name&&p.full_name!==p.name?p.full_name:"")+(p.came_on?" · came on":"")+(p.went_off?" · subbed off":"")+(p.sent_off?" · sent off":"")+"</div></div>"+note(p.rating)+'</div><div class="kv">'+kv.map(function(x){return "<div><b>"+x[1]+"</b><span>"+x[0]+"</span></div>"}).join("")+'</div>'+(kannWechseln(p,m)?'<div class="knopfreihe"><button class="knopf" data-wechsel="'+p.slot+'">Suggest a sub</button><button class="knopf zweit" data-zu="1">Close</button></div>':'<button class="pille" data-zu="1" style="align-self:flex-start">Close</button>')+'</div></section>'}

// ---- Substitutions -------------------------------------------------------------
var GRUPPE={GK:"GK",CB:"DEF",LB:"DEF",RB:"DEF",DMF:"MID",CMF:"MID",LMF:"MID",RMF:"MID",AMF:"MID",LWF:"ATT",RWF:"ATT",SS:"ATT",CF:"ATT"};
var NAH={LB:["LMF","CB"],RB:["RMF","CB"],CB:["DMF","LB","RB"],DMF:["CMF","CB"],CMF:["DMF","AMF"],LMF:["LWF","LB","CMF"],RMF:["RWF","RB","CMF"],AMF:["SS","CMF","CF"],LWF:["LMF","SS"],RWF:["RMF","SS"],SS:["CF","AMF"],CF:["SS"]};
function meineSeite(m){return S.mein==null?null:+S.mein}
function subsUsed(m,side){return m.events.filter(function(e){return e.kind==="sub"&&e.side===side}).length+(m.subs_pending||[]).filter(function(x){return x.side===side}).length}
function kannWechseln(p,m){return m.subs&&m.subs.available&&p.side===meineSeite(m)&&p.on_pitch&&!S.wechsel}
function bankFrei(m,side){
  var weg=(m.subs_pending||[]).map(function(x){return x.in_slot});
  return m.players.filter(function(q){return q.side===side&&!q.on_pitch&&!q.came_on&&!q.went_off&&!q.sent_off&&weg.indexOf(q.slot)<0});
}
function passt(raus,q){
  var a=raus.role||raus.position,b=q.position;
  if(!a||!b)return {s:1,w:"Bench player"};
  if(a===b)return {s:10,w:"Same position ("+b+")"};
  if(a==="GK"||b==="GK")return {s:-10,w:b==="GK"?"Goalkeeper":"Outfield player"};
  if((NAH[a]||[]).indexOf(b)>=0)return {s:7,w:"Can play there ("+b+" for "+a+")"};
  if(GRUPPE[a]===GRUPPE[b])return {s:5,w:"Same line ("+b+")"};
  return {s:1,w:"Different role ("+b+")"};
}
function vorschlaege(raus,m){
  return bankFrei(m,raus.side).map(function(q){var x=passt(raus,q);return {q:q,s:x.s,w:x.w}}).sort(function(a,b){return b.s-a.s||a.q.slot-b.q.slot});
}
function wechselKarte(m){
  var raus=spieler(m,meineSeite(m),S.wechsel.raus);if(!raus){S.wechsel=null;return ""}
  var lim=(m.subs.limit&&m.subs.limit[raus.side])||5,left=lim-subsUsed(m,raus.side);
  var h='<section class="karte" style="border:2px solid var(--b-presse)"><div class="k-kopf kf-presse"><h2 class="titel">Sub ideas</h2><small>'+Math.max(0,left)+" of "+lim+' left</small></div><div class="k-in">';
  h+='<div class="detail"><div class="oben"><span class="trikot">'+trikot(raus.side,raus.number,raus.position==="GK")+foto(raus)+'</span><div style="flex:1;min-width:0"><h3 class="titel">'+esc(raus.name)+' off</h3><div style="font-size:13.5px;color:var(--text2)">'+posmarke(raus.role||raus.position)+"</div></div>"+note(raus.rating)+"</div></div>";
  if(S.wechsel.rein!=null){var q=spieler(m,raus.side,S.wechsel.rein);
    h+='<div class="hinweis-z" style="font-size:16px">Bring on <b>'+esc(q.name)+"</b> for <b>"+esc(raus.name)+'</b>.<br><span style="font-size:13.5px;color:var(--text2)">Make the change in FL27: pause, open Substitutions and swap the two. The phone shows it as soon as it is requested.</span></div><div class="knopfreihe"><button class="knopf" data-abbruch="1">Got it</button><button class="knopf zweit" data-zurueck="1">Other player</button></div>';
    return h+"</div></section>"}
  if(left<=0)return h+'<div class="leer">No substitutions left.</div><button class="knopf zweit" data-abbruch="1">Close</button></div></section>';
  var v=vorschlaege(raus,m),zeige=S.wechsel.alle?v:v.slice(0,3);
  if(!v.length)h+='<div class="leer">No bench players available.</div>';
  zeige.forEach(function(x){var q=x.q;h+='<button class="vorschlag" data-rein="'+q.slot+'"><span class="trikot">'+trikot(q.side,q.number,q.position==="GK")+'</span><span>'+esc(q.name)+" "+posmarke(q.position)+"<small>"+esc(x.w)+'</small></span><span class="los">›</span></button>'});
  if(v.length>3)h+='<button class="vorschlag alle" data-alle="1"><span>'+(S.wechsel.alle?"Show only the top 3":"See whole bench ("+v.length+")")+'</span><span class="los">'+(S.wechsel.alle?"‹":"›")+"</span></button>";
  return h+'<button class="knopf zweit" data-abbruch="1">Cancel</button></div></section>';
}
function toast(t){var e=document.createElement("div");e.className="toast";e.setAttribute("role","status");e.textContent=t;document.body.appendChild(e);setTimeout(function(){e.remove()},3500)}

function tabStats(m){
  var h='<section class="karte"><div class="k-kopf kf-training"><h2 class="titel">Team</h2><small>'+esc(m.home)+" · "+esc(m.away)+'</small></div><div class="k-in">'+stz("xG (simple)",m.xg[0],m.xg[1],true)+m.team_stats.map(function(r){return stz(r.label,r.home,r.away)}).join("")+'<div class="leer" style="font-size:13px">Possession is not stored by FL27, so it is not shown. The bar at the top shows ball touches instead.</div></div></section>';
  var max=1;m.flow.forEach(function(f){max=Math.max(max,f.touches[0],f.touches[1])});
  h+='<section class="karte"><div class="k-kopf kf-presse"><h2 class="titel">Flow</h2><small>touches and shots per 15 min</small></div><div class="k-in"><div class="flow">'+m.flow.map(function(f){
    return "<span>"+esc(f.label)+'</span><div class="bars"><i style="width:'+f.touches[0]/max*100+'%;background:var(--heim)"></i><i style="width:'+f.touches[1]/max*100+'%;background:var(--gast)"></i></div>'+(f.shots[0]+f.shots[1]?'<span></span><span style="font-size:12px;color:var(--text2);margin-top:-4px">shots '+f.shots[0]+" : "+f.shots[1]+"</span>":"")}).join("")+"</div></div></section>";
  [0,1].forEach(function(side){
    var ps=m.players.filter(function(p){return p.side===side&&p.rating!=null}).sort(function(a,b){return b.rating-a.rating});
    h+='<section class="karte"><div class="k-kopf kf-heim" style="background:'+farbe(side)+';color:'+(side?"var(--gast-text)":"var(--heim-text)")+'"><h2 class="titel">'+esc(side===0?m.home:m.away)+'</h2><small>players</small></div><div class="k-in" style="overflow-x:auto"><table class="tab"><thead><tr><th>Player</th><th>G</th><th>A</th><th>Sh</th><th>Pass</th><th>Rating</th></tr></thead><tbody>'+
      ps.map(function(p){return '<tr><td>'+esc(p.name)+(p.went_off?' <span style="color:var(--gedaempft)">↓</span>':p.came_on?' <span style="color:var(--gut)">↑</span>':"")+"</td><td>"+p.goals+"</td><td>"+p.assists+"</td><td>"+p.shots+"</td><td>"+p.passes_ok+"/"+p.passes+"</td><td>"+note(p.rating,true)+"</td></tr>"}).join("")+"</tbody></table></div></section>"});
  return h;
}

// Ticker in newspaper style.
var SAETZE={
  goal:["What a moment for {t}!","{t} make it {s}.","The ball is in the net. {t} celebrate.","There it is! {t} strike."],
  goal1:["Cool as you like from the spot.","He sends the keeper the wrong way.","No mistake from twelve yards."],
  goal2:["A free kick right into the corner. Nothing the keeper could do.","Over the wall and in. Beautiful set piece."],
  own_goal:["Bad luck for {t}: the ball goes in off their own player.","An own goal. {t} won't want to see that again."],
  sub:["{t} make a change.","Fresh legs for {t}.","The coach reacts. Can the new men make a difference?"],
  red:["{t} are down to ten.","Off he goes. A big blow for {t}."],
  second_yellow:["Second yellow, so it's red. {t} are down to ten."],
  penalty_missed:["Penalty missed! {t} waste a huge chance.","He fails from the spot!"],
};
function satz(k,e,m,stand){var a=SAETZE[k];if(!a)return "";var t=e.side===0?m.home:m.away;return a[e.seq%a.length].replace("{t}",t).replace("{s}",stand)}
function vorname(p){if(!p||!p.full_name||p.full_name===p.name)return "";var f=p.full_name.split(" ");return f.length>1?f.slice(0,-1).join(" "):""}
function spKarte(p,side,art,rechts){
  return '<div class="gk-sp"><span class="trikot">'+trikot(side,p?p.number:null,p&&p.position==="GK")+foto(p)+'</span><span><span class="vor">'+esc(vorname(p))+'</span><span class="nam">'+esc(p?p.name:"?")+'</span>'+(art?'<span class="art">'+art+"</span>":"")+"</span>"+(rechts||"")+"</div>"}
function wZelle(p,side,rein){
  return '<div class="wz '+(rein?"rein":"raus")+'"><span class="pf">'+(rein?"↑":"↓")+'</span><span class="trikot">'+trikot(side,p?p.number:null,p&&p.position==="GK")+foto(p)+'</span><span><small>'+esc(vorname(p))+"</small><b>"+esc(p?p.name:"?")+"</b></span></div>"}
function kopf(e,m,titel,sym,farbeK){
  return '<div class="gk-kopf'+(farbeK?"":" s"+e.side)+'" style="background:'+(farbeK||farbe(e.side))+'"><span class="m">'+e.minute+"'</span><h3>"+esc(titel)+'</h3><span class="sym">'+sym+"</span></div>"}
function tickerBloecke(m,alle){
  // Chronological pass: running score, and subs of one side in the same minute go together.
  var st=[0,0],out=[];
  m.events.forEach(function(e){
    if(e.kind==="goal")st[e.side]++;
    if(e.kind==="own_goal")st[1-e.side]++;
    if(!alle&&!e.key)return;
    var last=out[out.length-1];
    if(e.kind==="sub"&&last&&last.kind==="sub"&&last.side===e.side&&Math.abs(last.minute-e.minute)<=1){last.subs.push(e);return}
    out.push({kind:e.kind,side:e.side,minute:e.minute,e:e,subs:[e],stand:[st[0],st[1]]});
  });
  return out.reverse();
}
function block(b,m){
  var e=b.e,team=e.side===0?m.home:m.away,p=spieler(m,e.side,e.slot);
  if(e.kind==="goal"||e.kind==="own_goal"){
    var sc=e.kind==="goal"?e.side:1-e.side,fuer=sc===0?m.home:m.away;
    var stand='<span class="stand" style="color:'+farbe(sc)+'">'+(sc===0?b.stand[0]+"<i> : </i>"+"<i>"+b.stand[1]+"</i>":"<i>"+b.stand[0]+" : </i>"+b.stand[1])+"</span>";
    var art=e.kind==="own_goal"?"Own goal":e.detail===1?"Penalty":e.detail===2?"Free kick":"";
    if(e.kind==="goal"&&e.other!=null){var a=spieler(m,e.side,e.other);art=(art?art+" · ":"")+"Assist "+esc(a?a.name:"?")}
    var txt=satz(e.kind==="own_goal"?"own_goal":"goal",{side:sc,seq:e.seq},m,b.stand[0]+":"+b.stand[1]);
    if(e.kind==="goal"&&e.detail)txt+=" "+satz("goal"+e.detail,e,m);
    return '<section class="gk tor">'+kopf({minute:e.minute,side:sc},m,"Goal for "+fuer,wappenKlein(m,sc,"⚽"))+'<div class="gk-in">'+spKarte(p,e.side,art,stand)+'<p class="gk-txt">'+esc(txt)+"</p></div></section>";
  }
  if(e.kind==="sub"){
    var rows=b.subs.map(function(x){return '<div class="wb">'+wZelle(spieler(m,x.side,x.slot),x.side,true)+wZelle(x.other!=null?spieler(m,x.side,x.other):null,x.side,false)+"</div>"}).join("");
    return '<section class="gk">'+kopf(e,m,b.subs.length>1?b.subs.length+" substitutions":"Substitution","⇄","var(--ueberlagerung);color:var(--text)")+'<div class="gk-in">'+rows+'<p class="gk-txt">'+esc(satz("sub",e,m))+"</p></div></section>";
  }
  if(e.kind==="red"||e.kind==="second_yellow"){
    return '<section class="gk">'+kopf(e,m,e.kind==="red"?"Red card":"Second yellow",'<span class="kk '+(e.kind==="red"?"r":"gr")+'"></span>',"#3a1418")+'<div class="gk-in">'+spKarte(p,e.side,esc(team))+'<p class="gk-txt">'+esc(satz(e.kind,e,m))+"</p></div></section>";
  }
  if(e.kind==="penalty_missed"){
    return '<section class="gk">'+kopf(e,m,"Penalty missed","✕","#4a3410")+'<div class="gk-in">'+spKarte(p,e.side,esc(team))+'<p class="gk-txt">'+esc(satz("penalty_missed",e,m))+"</p></div></section>";
  }
  var icon=e.kind==="yellow"?'<span class="kk g" style="width:11px;height:15px;vertical-align:-2px;margin-right:6px"></span>':"";
  return '<div class="tk-z'+(e.key?"":" leise")+(e.kind==="chance"?" heiss":"")+'"><span class="m">'+e.minute+"'</span><span class=\"t\">"+icon+esc(e.text)+' <span style="color:var(--gedaempft);font-weight:500;font-size:13px">'+esc(team)+"</span></span></div>";
}
function tabTicker(m){
  var alle=S.filter==="all",bl=tickerBloecke(m,alle);
  return '<div class="seg"><button class="pille" data-filter="key" aria-pressed="'+!alle+'">Key moments</button><button class="pille" data-filter="all" aria-pressed="'+alle+'">Everything</button></div>'+
    (bl.length?'<div class="tk">'+bl.map(function(b){return block(b,m)}).join("")+'</div><div class="leer" style="font-size:12.5px;text-align:center">Minutes are estimates.</div>':'<section class="karte"><div class="k-in"><div class="leer">Goals, chances, cards and substitutions will show up here.</div></div></section>');
}

function binde(){
  document.querySelectorAll("[data-seite]").forEach(function(b){b.onclick=function(){S.seite=+b.dataset.seite;S.gew=null;render()}});
  document.querySelectorAll("[data-slot]").forEach(function(b){b.onclick=function(){var s=+b.dataset.slot;S.gew=S.gew===s?null:s;render();$("inhalt").parentNode.scrollTop=0}});
  document.querySelectorAll("[data-zu]").forEach(function(b){b.onclick=function(){S.gew=null;S.wechsel=null;render()}});
  document.querySelectorAll("[data-filter]").forEach(function(b){b.onclick=function(){S.filter=b.dataset.filter;store.set("cz-filter",S.filter);render()}});
  document.querySelectorAll("[data-mein]").forEach(function(b){b.onclick=function(){S.mein=b.dataset.mein;store.set("cz-mein",S.mein);render()}});
  document.querySelectorAll("[data-wechsel]").forEach(function(b){b.onclick=function(){S.wechsel={raus:+b.dataset.wechsel,alle:false,rein:null};render()}});
  document.querySelectorAll("[data-alle]").forEach(function(b){b.onclick=function(){S.wechsel.alle=!S.wechsel.alle;render()}});
  document.querySelectorAll("[data-rein]").forEach(function(b){b.onclick=function(){S.wechsel.rein=+b.dataset.rein;render()}});
  document.querySelectorAll("[data-zurueck]").forEach(function(b){b.onclick=function(){S.wechsel.rein=null;render()}});
  document.querySelectorAll("[data-abbruch]").forEach(function(b){b.onclick=function(){S.wechsel=null;render()}});
}
document.querySelectorAll("nav button").forEach(function(b){b.onclick=function(){S.tab=b.dataset.t;store.set("cz-tab",S.tab);render();document.querySelector("main").scrollTop=0}});

if(token)start();else zeigeKoppeln();
</script>
</body>

[package]
name = "pesm-coaching-zone"
version = "0.2.2"
edition = "2024"
description = "Live Football Life 2027 match stats on your phone, over your home Wi-Fi. Unofficial fan tool."
license = "MIT"
repository = "https://github.com/FabianZettl/pesm-coaching-zone"
readme = "README.md"
keywords = ["fl27", "pes", "football", "stats", "companion"]

[profile.release]
lto = true
codegen-units = 1
strip = true

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8", features = ["ws"] }
flate2 = "1.1.11"
local-ip-address = "0.6.13"
png = "0.18.1"
qrcode = "0.15.0"
rand = "0.10.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
texture2ddecoder = "0.1.2"
tokio = { version = "1.54.1", features = ["full"] }

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_Memory", "Win32_System_Diagnostics_Debug", "Win32_System_Diagnostics_ToolHelp"] }

name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            bin: pesm-coaching-zone
            asset: pesm-coaching-zone-linux-x86_64
          - os: windows-latest
            bin: pesm-coaching-zone.exe
            asset: pesm-coaching-zone-windows-x86_64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --locked
      - run: cargo build --release --locked
      - name: Rename binary
        shell: bash
        run: cp target/release/${{ matrix.bin }} ${{ matrix.asset }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: PESM Coaching Zone ${{ github.ref_name }}
          body_path: docs/release-notes/${{ github.ref_name }}.md
          files: ${{ matrix.asset }}
